```yaml
name: Build Nyxie Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Nyxie" "com.lumina.nyxie" --web-dir "www"
          mkdir -p www
          cp -r index.html assets www/ 2>/dev/null || cp index.html www/
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions & Orientation
        run: |
          # Configuration pour le mode paysage et écran complet immersif
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyxie-Compagnon-Magique-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
